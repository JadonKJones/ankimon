name: Prepare and Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version string (e.g., 2.04 or 2.04-E)"
        required: true
      highlights:
        description: "Highlights/What's new summary (optional)"
        required: false
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest pytest-qt PyQt6 markdown

      - name: Prepare Release Files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/prepare_release.py --version "${{ github.event.inputs.version }}" --highlights "${{ github.event.inputs.highlights }}"
          python scripts/generate_discord_changelog.py --version "${{ github.event.inputs.version }}"

      - name: Generate Contributors Table
        run: |
          npx -y all-contributors-cli generate

      - name: Run Integrity Tests
        run: |
          pytest tests/test_addon_integrity.py

      - name: Commit and Push Changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add src/Ankimon/manifest.json .all-contributorsrc README.md assets/changelogs/
          if git diff --cached --quiet; then
            echo "No release changes to commit (already up to date); skipping commit."
          else
            git commit -m "chore: bump version and update changelog for ${{ github.event.inputs.version }}"
            git push origin main
          fi

      # Pushing the tag (with the PAT) triggers the existing "Create Add-on Release"
      # workflow (main.yml), which checks out the tag *with submodules*, builds the
      # .ankiaddon (injecting the poke_engine submodule), and publishes the GitHub
      # Release. We intentionally do NOT build/publish here — doing both would race
      # two identical builds onto the same tag and asset.
      - name: Create and Push Tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if git ls-remote --exit-code origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists on origin; skipping tag creation."
            echo "To (re)build an existing tag, run the 'Create Add-on Release' workflow manually."
          else
            git tag "${VERSION}" -m "Release ${VERSION}"
            git push origin "${VERSION}"
            echo "Pushed tag ${VERSION}. The 'Create Add-on Release' workflow will now build and publish it."
          fi
